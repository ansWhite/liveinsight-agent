services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: liveinsight
      POSTGRES_PASSWORD: liveinsight
      POSTGRES_DB: liveinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.9.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: liveinsight
      MINIO_ROOT_PASSWORD: liveinsight123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
